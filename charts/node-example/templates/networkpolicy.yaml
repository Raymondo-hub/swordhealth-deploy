{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "node-example.fullname" . }}-ingress
  labels:
    {{- include "node-example.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "node-example.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if .Values.networkPolicy.allowedIngressCidrs }}
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedIngressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: http
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
