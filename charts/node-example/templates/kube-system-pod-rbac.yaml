{{- if .Values.rbac.allowListKubeSystemPods }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "node-example.fullname" . }}-pod-reader
  namespace: kube-system
  labels:
    {{- include "node-example.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "node-example.fullname" . }}-pod-reader
  namespace: kube-system
  labels:
    {{- include "node-example.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default (include "node-example.fullname" .) }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "node-example.fullname" . }}-pod-reader
{{- end }}
