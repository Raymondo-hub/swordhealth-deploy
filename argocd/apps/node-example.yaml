apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-example-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: delivery
  source:
    repoURL: https://github.com/Raymondo-hub/swordhealth-deploy.git
    targetRevision: main
    path: charts/node-example
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: swordhealth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
